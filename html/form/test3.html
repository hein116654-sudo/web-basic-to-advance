<form>

    <h3>Gender</h3>

    <label>
        <input
            type="radio"
            name="gender"
            value="male"
        >
        Male
    </label>

    <label>
        <input
            type="radio"
            name="gender"
            value="female"
        >
        Female
    </label>


    <h3>Skills</h3>

    <label>
        <input
            type="checkbox"
            name="skills"
            value="html"
        >
        HTML
    </label>

    <label>
        <input
            type="checkbox"
            name="skills"
            value="css"
        >
        CSS
    </label>

    <label>
        <input
            type="checkbox"
            name="skills"
            value="javascript"
        >
        JavaScript
    </label>


    <h3>Country</h3>

    <label for="country">
        Country
    </label>

    <select id="country" name="country">

        <option value="">
            Select Country
        </option>

        <option value="mm">
            Myanmar
        </option>

        <option value="th">
            Thailand
        </option>

        <option value="sg">
            Singapore
        </option>

    </select>

</form>

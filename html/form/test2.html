<form>

    <label for="username">
        Username
    </label>

    <input
        type="text"
        id="username"
        name="username"
        required
        minlength="3"
        maxlength="20"
    >

    <br><br>

    <label for="email">
        Email
    </label>

    <input
        type="email"
        id="email"
        name="email"
        required
    >

    <br><br>

    <label for="age">
        Age
    </label>

    <input
        type="number"
        id="age"
        name="age"
        min="18"
        max="100"
        required
    >

    <br><br>

    <button type="submit">
        Submit
    </button>

</form>

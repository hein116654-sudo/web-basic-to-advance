<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accessibility Practice</title>
</head>

<body>

    <header>

        <nav aria-label="Main navigation">

            <a href="#home">
                Home
            </a>

            <a href="#products">
                Products
            </a>

            <a href="#contact">
                Contact
            </a>

        </nav>

    </header>


    <main>

        <section id="home">

            <h1>Welcome</h1>

            <img
                src="https://via.placeholder.com/400"
                alt="Laptop showing a web development project"
            >

        </section>


        <section id="contact">

            <h2>Contact Us</h2>

            <form>

                <div>

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                    >

                </div>

                <br>

                <div>

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >

                </div>

                <br>

                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>


    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>

</html>

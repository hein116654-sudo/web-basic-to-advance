<!DOCTYPE html>
<html>
    <head>
        <title></title>
    </head>
    <body>
        <script>
            async function getUserSafely(userId) {
            try {
                console.log("Loading... (Starting search)");

                // Intentionally testing with a sample URL (e.g., non-existent user id 9999)
                const response = await fetch(`https://jsonplaceholder.typicode.com/users/${userId}`);

                // Most crucial step: Check if response.ok is true
                if (!response.ok) {
                // If response.ok is false, manually throw an error to push execution into the catch block
                throw new Error(`Data not found! HTTP Status: ${response.status}`);
                }

                const data = await response.json();
                console.log("✅ User search successful:", data);
                return data;

            } catch (error) {
                // Catch 404/500 errors or network failure issues here
                console.error("❌ An error occurred:", error.message);

            } finally {
                // Runs last whether successful or failed
                // This is typically where you would hide a loading spinner
                console.log("🏁 Process finished. (Loading Finished)");
            }
            }

            // --- Example Usages ---

            // Test 1: Successful request (User ID 1 exists)
            console.log("--- Testing with a valid user ---");
            getUserSafely(1);

            // Test 2: Failed request (User ID 9999 does not exist, triggers 404 and goes to catch)
            // setTimeout(() => {
            //   console.log("\n--- Testing with an invalid user ---");
            //   getUserSafely(9999);
            // }, 1000);           
        </script>
    </body>
</html>

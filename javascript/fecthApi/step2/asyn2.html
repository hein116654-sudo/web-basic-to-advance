
<!DOCTYPE html>
<html>
<head>
    <title>Fetch API - Async Await</title>
    <link rel="icon" href="./favicon.ico">
</head>
<body>

    <h1>Fetch API Example</h1>

    <script>
        async function getUsers() {

            console.log("Fetching data....");

            // Step 1: Send API Request
            const response = await fetch(
                'https://jsonplaceholder.typicode.com/users'
            );

            console.log("Response Object:", response);

            // Step 2: Convert JSON to JavaScript Object
            const data = await response.json();

            console.log("User data list");
            console.log(data);

            // Step 3: Access First User
            console.log("First User Name:", data[0].name);
            console.log("First User Email:", data[0].email);
        }

        // Call function
        getUsers();
    </script>

</body>
</html>

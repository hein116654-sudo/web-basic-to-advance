
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API - Promise vs Async Await</title>
</head>
<body>

    <h1>Fetch API Examples</h1>

    <button onclick="getDataThen()">Run .then() Method</button>
    <button onclick="getDataAsync()">Run Async/Await Method</button>

    <script>

        // =================================
        // 1. Old Method (.then())
        // =================================

        function getDataThen() {

            console.log("Fetching data using .then()...");

            fetch("https://jsonplaceholder.typicode.com/users")

                // Step 1: Get Response
                .then(res => {

                    if (!res.ok) {
                        throw new Error("HTTP Error: " + res.status);
                    }

                    return res.json();
                })

                // Step 2: Get JSON Data
                .then(data => {

                    console.log(".then() - User Data:");
                    console.log(data);

                    console.log("First User:", data[0].name);
                    console.log("First Email:", data[0].email);

                })

                // Step 3: Handle Error
                .catch(error => {

                    console.error(".then() Error:", error.message);

                });
        }


        // =================================
        // 2. Modern Method (async/await)
        // =================================

        async function getDataAsync() {

            try {

                console.log("Fetching data using async/await...");

                // Step 1: Send API Request
                const res = await fetch(
                    "https://jsonplaceholder.typicode.com/users"
                );

                if (!res.ok) {
                    throw new Error("HTTP Error: " + res.status);
                }

                // Step 2: Convert JSON Data
                const data = await res.json();

                // Step 3: Display Data
                console.log("Async/Await - User Data:");
                console.log(data);

                console.log("First User:", data[0].name);
                console.log("First Email:", data[0].email);

            } catch (error) {

                console.error("Async/Await Error:", error.message);

            }
        }

    </script>

</body>
</html>

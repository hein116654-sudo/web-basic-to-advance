<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Array and Object</h2>
    <script>
        console.log('Arrays and Objects');
        const fruits = ['Apple', 'Orange', 'Banana'];
        console.log('Fruit length before push: ', fruits.length);
        fruits.push('Mango');
        console.log('First fruit', fruits[0]);
        console.log('Fruit length after push: ', fruits.length);

        // for....of , output Array
        console.log("All fruit:");
        for (const abc of fruits) {
            console.log('-' , abc);
        }

        //normal for loop
        console.log('Normale For loop');
        for (let i = 0; i < fruits.length; i ++) {
            console.log(fruits[i]);
        }

        //Object 
        const student = {
            name: 'Hla Hla',
            age: 20,
            major: 'Conputer Science'
        };
        console.log('Student Name: ', student.name);
        console.log('Student Age: ', student.age);

        student.city = 'Yangon';
        console.log('Address: ', student.city);

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Data Types</h2>
    <script>
        let name = "Hein";       //string
        let age = 10;           //int
        let isProgrammer = true ; //boolean
        let futureGoal;         //undefined
        let emptyWallet = null ; //null

        console.log(`My name is ${name}, I'm ${age} years old.`);
        console.log('name data type=', typeof name);
        console.log('age data type=', typeof age);
        console.log('programmer data type=', typeof isProgrammer);
        console.log('future data type=', typeof futureGoal);
        console.log('empty wallet data type=', typeof emptyWallet);

        </script>
</body>
</html>

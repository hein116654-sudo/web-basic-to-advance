<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Loops</h2>
    <script>
        console.log('For Loop');
        for (let i = 1; i <= 3; i++) {
            console.log(`Loop count: ${i}`);
        }

        console.log('While Loop');
        let countDown = 3;
        while (countDown > 0) {
            console.log(`CountDown: ${countDown}`);
            countDown -- ;
        }
    </script>
</body>
</html>

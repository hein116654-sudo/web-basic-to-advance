<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>3D Heart Galaxy ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #02010a;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        body {
            position: relative;
            color: white;
        }

        #app {
            width: 100%;
            height: 100%;
            position: relative;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        /* =========================================
           TOP LEFT
        ========================================= */

        .brand {
            position: fixed;
            top: 30px;
            left: 35px;
            z-index: 10;

            display: flex;
            align-items: center;
            gap: 14px;

            pointer-events: none;
        }

        .brand-heart {
            width: 50px;
            height: 50px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid rgba(255, 90, 150, 0.5);
            border-radius: 50%;

            background: rgba(255, 20, 100, 0.08);

            box-shadow:
                0 0 25px rgba(255, 30, 120, 0.3),
                inset 0 0 20px rgba(255, 30, 120, 0.1);

            font-size: 26px;

            animation: brandPulse 2s ease-in-out infinite;
        }

        .brand-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            margin-top: 3px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.55);
            letter-spacing: 1px;
        }

        @keyframes brandPulse {
            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        /* =========================================
           TECHNOLOGY BADGE
        ========================================= */

        .tech-badge {
            position: fixed;
            top: 32px;
            right: 35px;
            z-index: 10;

            padding: 12px 18px;

            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 30px;

            background: rgba(10, 5, 25, 0.45);
            backdrop-filter: blur(15px);

            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);

            box-shadow:
                0 0 25px rgba(120, 50, 255, 0.12);
        }

        .tech-badge span {
            color: #ff5c9a;
            margin-right: 7px;
        }

        /* =========================================
           CONTROL PANEL
        ========================================= */

        .controls {
            position: fixed;
            left: 35px;
            top: 50%;
            transform: translateY(-50%);

            z-index: 10;

            width: 230px;

            padding: 20px;

            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    rgba(20, 10, 35, 0.72),
                    rgba(5, 5, 20, 0.5)
                );

            backdrop-filter: blur(18px);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.35),
                inset 0 0 30px rgba(255, 255, 255, 0.02);
        }

        .controls-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 18px;

            color: #fff;
        }

        .control-item {
            display: flex;
            gap: 12px;
            align-items: center;

            margin-bottom: 15px;
        }

        .control-icon {
            width: 38px;
            height: 38px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.06);

            font-size: 17px;
        }

        .control-text {
            font-size: 12px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.72);
        }

        .control-text strong {
            display: block;
            color: white;
            font-size: 12px;
        }

        /* =========================================
           CENTER MESSAGE
        ========================================= */

        .center-message {
            position: fixed;
            left: 50%;
            bottom: 55px;

            transform: translateX(-50%);

            z-index: 10;

            text-align: center;

            pointer-events: none;
        }

        .center-message h2 {
            font-family: Georgia, serif;
            font-style: italic;

            font-size: clamp(28px, 4vw, 48px);

            font-weight: 400;

            text-shadow:
                0 0 15px rgba(255, 60, 150, 0.8),
                0 0 40px rgba(255, 30, 150, 0.4);
        }

        .center-message p {
            margin-top: 5px;

            font-size: 12px;

            letter-spacing: 3px;

            text-transform: uppercase;

            color: rgba(255, 255, 255, 0.5);
        }

        .center-heart {
            margin: 13px auto 0;

            font-size: 25px;

            animation:
                floatingHeart 1.5s ease-in-out infinite;
        }

        @keyframes floatingHeart {
            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-5px) scale(1.15);
            }
        }

        /* =========================================
           BOTTOM LEFT
        ========================================= */

        .status {
            position: fixed;
            bottom: 30px;
            left: 35px;

            z-index: 10;

            padding: 10px 16px;

            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 30px;

            background: rgba(10, 5, 25, 0.4);
            backdrop-filter: blur(10px);

            color: rgba(255, 255, 255, 0.65);

            font-size: 11px;

            letter-spacing: 0.5px;
        }

        .status-dot {
            display: inline-block;

            width: 7px;
            height: 7px;

            margin-right: 7px;

            border-radius: 50%;

            background: #ff4f9a;

            box-shadow:
                0 0 10px #ff4f9a;

            animation: statusPulse 1.2s infinite;
        }

        @keyframes statusPulse {
            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {
            .brand {
                top: 18px;
                left: 18px;
            }

            .brand-heart {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }

            .brand-title {
                font-size: 18px;
            }

            .brand-subtitle {
                font-size: 9px;
            }

            .tech-badge {
                top: 20px;
                right: 18px;
                padding: 8px 12px;
                font-size: 10px;
            }

            .controls {
                left: 50%;
                top: auto;
                bottom: 15px;

                transform: translateX(-50%);

                width: calc(100% - 36px);

                padding: 10px 15px;

                display: flex;
                justify-content: space-between;
                gap: 8px;
            }

            .controls-title {
                display: none;
            }

            .control-item {
                margin: 0;
                gap: 6px;
            }

            .control-icon {
                width: 30px;
                height: 30px;
                font-size: 13px;
            }

            .control-text {
                display: none;
            }

            .status {
                display: none;
            }

            .center-message {
                bottom: 100px;
            }

            .center-message h2 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<div id="app">

    <!-- =========================================
         BRAND
    ========================================== -->

    <div class="brand">

        <div class="brand-heart">
            ❤️
        </div>

        <div>
            <div class="brand-title">
                3D Heart Galaxy
            </div>

            <div class="brand-subtitle">
                Three.js • JavaScript • GSAP
            </div>
        </div>

    </div>


    <!-- =========================================
         TOP RIGHT
    ========================================== -->

    <div class="tech-badge">
        <span>♥</span>
        Interactive 3D Experience
    </div>


    <!-- =========================================
         CONTROLS
    ========================================== -->

    <div class="controls">

        <div class="controls-title">
            ✨ INTERACTION
        </div>

        <div class="control-item">

            <div class="control-icon">
                🖱️
            </div>

            <div class="control-text">
                <strong>Drag to rotate</strong>
                Move around the heart
            </div>

        </div>

        <div class="control-item">

            <div class="control-icon">
                🔍
            </div>

            <div class="control-text">
                <strong>Scroll to zoom</strong>
                Zoom in / out
            </div>

        </div>

        <div class="control-item">

            <div class="control-icon">
                💥
            </div>

            <div class="control-text">
                <strong>Click the heart</strong>
                Special effect
            </div>

        </div>

    </div>


    <!-- =========================================
         CENTER
    ========================================== -->

    <div class="center-message">

        <h2>
            Tap the Heart
        </h2>

        <p>
            and feel the magic
        </p>

        <div class="center-heart">
            ♡
        </div>

    </div>


    <!-- =========================================
         STATUS
    ========================================== -->

    <div class="status">
        <span class="status-dot"></span>
        Galaxy particles active
    </div>

</div>


<!-- =============================================
     THREE.JS
============================================= -->

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>


<script type="module">

    import * as THREE from "three";

    import {
        OrbitControls
    } from "three/addons/controls/OrbitControls.js";


    /*
    ============================================================
        SCENE
    ============================================================
    */

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x02010a);

    scene.fog = new THREE.FogExp2(
        0x02010a,
        0.025
    );


    /*
    ============================================================
        CAMERA
    ============================================================
    */

    const camera = new THREE.PerspectiveCamera(
        55,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );

    camera.position.set(
        0,
        0,
        14
    );


    /*
    ============================================================
        RENDERER
    ============================================================
    */

    const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure = 1.4;

    document.body.appendChild(
        renderer.domElement
    );


    /*
    ============================================================
        ORBIT CONTROLS
    ============================================================
    */

    const controls =
        new OrbitControls(
            camera,
            renderer.domElement
        );

    controls.enableDamping = true;

    controls.dampingFactor = 0.05;

    controls.enablePan = false;

    controls.minDistance = 7;

    controls.maxDistance = 22;

    controls.target.set(
        0,
        0,
        0
    );


    /*
    ============================================================
        LIGHTS
    ============================================================
    */

    const pinkLight =
        new THREE.PointLight(
            0xff207f,
            80,
            25
        );

    pinkLight.position.set(
        0,
        1,
        4
    );

    scene.add(pinkLight);


    const blueLight =
        new THREE.PointLight(
            0x4d7cff,
            70,
            25
        );

    blueLight.position.set(
        -5,
        2,
        2
    );

    scene.add(blueLight);


    const purpleLight =
        new THREE.PointLight(
            0x9c4dff,
            60,
            25
        );

    purpleLight.position.set(
        5,
        -2,
        -3
    );

    scene.add(purpleLight);


    /*
    ============================================================
        GALAXY
    ============================================================
    */

    const galaxyGroup =
        new THREE.Group();

    scene.add(galaxyGroup);


    const galaxyCount = 9000;

    const galaxyPositions =
        new Float32Array(
            galaxyCount * 3
        );

    const galaxyColors =
        new Float32Array(
            galaxyCount * 3
        );


    const colorPink =
        new THREE.Color(0xff3c9d);

    const colorBlue =
        new THREE.Color(0x5b7cff);

    const colorPurple =
        new THREE.Color(0xb45cff);

    const colorWhite =
        new THREE.Color(0xffffff);


    for (
        let i = 0;
        i < galaxyCount;
        i++
    ) {

        const i3 = i * 3;


        /*
        Spiral galaxy math
        */

        const radius =
            Math.pow(
                Math.random(),
                0.65
            ) * 12;


        const branches = 4;


        const branchAngle =
            (
                i % branches
            ) / branches *
            Math.PI * 2;


        const spin =
            radius * 0.75;


        const angle =
            branchAngle + spin;


        const random =
            Math.pow(
                Math.random(),
                3
            ) * 1.8;


        const x =
            Math.cos(angle) *
            radius +
            (Math.random() - 0.5) *
            random;


        const y =
            (Math.random() - 0.5) *
            random;


        const z =
            Math.sin(angle) *
            radius +
            (Math.random() - 0.5) *
            random;


        galaxyPositions[i3] = x;

        galaxyPositions[i3 + 1] = y;

        galaxyPositions[i3 + 2] = z;


        /*
        Random galaxy colors
        */

        const randomColor =
            Math.random();


        let color;


        if (randomColor < 0.35) {

            color = colorPink;

        } else if (
            randomColor < 0.65
        ) {

            color = colorBlue;

        } else if (
            randomColor < 0.85
        ) {

            color = colorPurple;

        } else {

            color = colorWhite;
        }


        galaxyColors[i3] =
            color.r;

        galaxyColors[i3 + 1] =
            color.g;

        galaxyColors[i3 + 2] =
            color.b;
    }


    const galaxyGeometry =
        new THREE.BufferGeometry();


    galaxyGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            galaxyPositions,
            3
        )
    );


    galaxyGeometry.setAttribute(
        "color",
        new THREE.BufferAttribute(
            galaxyColors,
            3
        )
    );


    const galaxyMaterial =
        new THREE.PointsMaterial({

            size: 0.035,

            transparent: true,

            opacity: 0.85,

            vertexColors: true,

            blending:
                THREE.AdditiveBlending,

            depthWrite: false

        });


    const galaxy =
        new THREE.Points(
            galaxyGeometry,
            galaxyMaterial
        );


    galaxyGroup.add(galaxy);


    /*
    ============================================================
        HEART
    ============================================================
    */

    const heartGroup =
        new THREE.Group();

    scene.add(heartGroup);


    const heartCount = 7000;


    const heartPositions =
        new Float32Array(
            heartCount * 3
        );


    const heartColors =
        new Float32Array(
            heartCount * 3
        );


    const heartSizes =
        new Float32Array(
            heartCount
        );


    /*
    Heart equation:

    x = 16 sin³(t)

    y =
    13cos(t)
    - 5cos(2t)
    - 2cos(3t)
    - cos(4t)
    */


    for (
        let i = 0;
        i < heartCount;
        i++
    ) {

        const i3 = i * 3;


        const t =
            Math.random() *
            Math.PI * 2;


        /*
        Fill the heart
        */

        const radius =
            Math.sqrt(
                Math.random()
            );


        let x =
            16 *
            Math.pow(
                Math.sin(t),
                3
            );


        let y =
            13 *
            Math.cos(t)
            -
            5 *
            Math.cos(2 * t)
            -
            2 *
            Math.cos(3 * t)
            -
            Math.cos(4 * t);


        x *= radius;

        y *= radius;


        /*
        Convert size
        */

        x *= 0.27;

        y *= 0.27;


        /*
        Give heart 3D thickness
        */

        const z =
            (
                Math.random() - 0.5
            ) *
            1.8 *
            (
                0.25 +
                radius
            );


        heartPositions[i3] =
            x;

        heartPositions[i3 + 1] =
            y - 0.5;

        heartPositions[i3 + 2] =
            z;


        /*
        Color variation
        */

        const color =
            new THREE.Color();


        const random =
            Math.random();


        if (random < 0.3) {

            color.set(
                0xff2f91
            );

        } else if (
            random < 0.6
        ) {

            color.set(
                0xff65c3
            );

        } else if (
            random < 0.8
        ) {

            color.set(
                0xb54cff
            );

        } else {

            color.set(
                0xffffff
            );
        }


        heartColors[i3] =
            color.r;

        heartColors[i3 + 1] =
            color.g;

        heartColors[i3 + 2] =
            color.b;


        heartSizes[i] =
            0.025 +
            Math.random() * 0.045;
    }


    const heartGeometry =
        new THREE.BufferGeometry();


    heartGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            heartPositions,
            3
        )
    );


    heartGeometry.setAttribute(
        "color",
        new THREE.BufferAttribute(
            heartColors,
            3
        )
    );


    heartGeometry.setAttribute(
        "size",
        new THREE.BufferAttribute(
            heartSizes,
            1
        )
    );


    const heartMaterial =
        new THREE.PointsMaterial({

            size: 0.045,

            transparent: true,

            opacity: 1,

            vertexColors: true,

            blending:
                THREE.AdditiveBlending,

            depthWrite: false

        });


    const heart =
        new THREE.Points(
            heartGeometry,
            heartMaterial
        );


    heartGroup.add(heart);


    /*
    ============================================================
        HEART GLOW RINGS
    ============================================================
    */

    const ringGroup =
        new THREE.Group();

    scene.add(ringGroup);


    function createRing(
        radius,
        color,
        opacity
    ) {

        const geometry =
            new THREE.TorusGeometry(
                radius,
                0.018,
                16,
                160
            );


        const material =
            new THREE.MeshBasicMaterial({

                color,

                transparent: true,

                opacity,

                blending:
                    THREE.AdditiveBlending
            });


        const mesh =
            new THREE.Mesh(
                geometry,
                material
            );


        return mesh;
    }


    const ring1 =
        createRing(
            4.3,
            0xff4da6,
            0.55
        );


    ring1.rotation.x =
        Math.PI / 2;


    ringGroup.add(ring1);


    const ring2 =
        createRing(
            5.0,
            0x6b72ff,
            0.35
        );


    ring2.rotation.x =
        Math.PI / 2.5;


    ring2.rotation.z =
        0.4;


    ringGroup.add(ring2);


    const ring3 =
        createRing(
            5.7,
            0xb74cff,
            0.25
        );


    ring3.rotation.x =
        Math.PI / 1.8;


    ring3.rotation.z =
        -0.7;


    ringGroup.add(ring3);


    /*
    ============================================================
        SMALL FLOATING STARS
    ============================================================
    */

    const starCount = 1500;

    const starPositions =
        new Float32Array(
            starCount * 3
        );


    for (
        let i = 0;
        i < starCount;
        i++
    ) {

        const i3 = i * 3;


        const radius =
            15 +
            Math.random() * 25;


        const theta =
            Math.random() *
            Math.PI *
            2;


        const phi =
            Math.acos(
                2 * Math.random() - 1
            );


        starPositions[i3] =
            radius *
            Math.sin(phi) *
            Math.cos(theta);


        starPositions[i3 + 1] =
            radius *
            Math.sin(phi) *
            Math.sin(theta);


        starPositions[i3 + 2] =
            radius *
            Math.cos(phi);
    }


    const starGeometry =
        new THREE.BufferGeometry();


    starGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            starPositions,
            3
        )
    );


    const starMaterial =
        new THREE.PointsMaterial({

            color: 0xffffff,

            size: 0.04,

            transparent: true,

            opacity: 0.7,

            blending:
                THREE.AdditiveBlending,

            depthWrite: false
        });


    const stars =
        new THREE.Points(
            starGeometry,
            starMaterial
        );


    scene.add(stars);


    /*
    ============================================================
        EXPLOSION PARTICLES
    ============================================================
    */

    let explosionParticles = null;


    function createExplosion() {

        if (explosionParticles) {

            scene.remove(
                explosionParticles
            );

            explosionParticles
                .geometry
                .dispose();

            explosionParticles
                .material
                .dispose();
        }


        const count = 3000;


        const positions =
            new Float32Array(
                count * 3
            );


        const velocities =
            new Float32Array(
                count * 3
            );


        const colors =
            new Float32Array(
                count * 3
            );


        for (
            let i = 0;
            i < count;
            i++
        ) {

            const i3 = i * 3;


            const direction =
                new THREE.Vector3(
                    Math.random() - 0.5,
                    Math.random() - 0.5,
                    Math.random() - 0.5
                ).normalize();


            positions[i3] =
                direction.x *
                1.5;

            positions[i3 + 1] =
                direction.y *
                1.5;

            positions[i3 + 2] =
                direction.z *
                1.5;


            const speed =
                0.03 +
                Math.random() * 0.12;


            velocities[i3] =
                direction.x *
                speed;

            velocities[i3 + 1] =
                direction.y *
                speed;

            velocities[i3 + 2] =
                direction.z *
                speed;


            const color =
                new THREE.Color();


            if (
                Math.random() < 0.5
            ) {

                color.set(
                    0xff3d9a
                );

            } else {

                color.set(
                    0x8d5cff
                );
            }


            colors[i3] =
                color.r;

            colors[i3 + 1] =
                color.g;

            colors[i3 + 2] =
                color.b;
        }


        const geometry =
            new THREE.BufferGeometry();


        geometry.setAttribute(
            "position",
            new THREE.BufferAttribute(
                positions,
                3
            )
        );


        geometry.setAttribute(
            "color",
            new THREE.BufferAttribute(
                colors,
                3
            )
        );


        const material =
            new THREE.PointsMaterial({

                size: 0.055,

                vertexColors: true,

                transparent: true,

                opacity: 1,

                blending:
                    THREE.AdditiveBlending,

                depthWrite: false
            });


        explosionParticles =
            new THREE.Points(
                geometry,
                material
            );


        explosionParticles
            .userData.velocities =
            velocities;


        scene.add(
            explosionParticles
        );


        /*
        Animate explosion
        */

        const startScale =
            {
                value: 0.1
            };


        gsap.to(
            startScale,
            {
                value: 1,

                duration: 0.35,

                ease: "power3.out"
            }
        );


        gsap.to(
            material,
            {
                opacity: 0,

                duration: 2,

                ease: "power2.out",

                onComplete: () => {

                    if (
                        explosionParticles
                    ) {

                        scene.remove(
                            explosionParticles
                        );

                        explosionParticles
                            .geometry
                            .dispose();

                        explosionParticles
                            .material
                            .dispose();

                        explosionParticles =
                            null;
                    }
                }
            }
        );
    }


    /*
    ============================================================
        GSAP
    ============================================================
    */

    /*
    We load GSAP dynamically.
    */

    const gsapModule =
        await import(
            "https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm"
        );


    const gsap =
        gsapModule.gsap;


    /*
    ============================================================
        HEART CLICK
    ============================================================
    */

    const raycaster =
        new THREE.Raycaster();


    const mouse =
        new THREE.Vector2();


    renderer.domElement.addEventListener(
        "click",
        (event) => {

            mouse.x =
                (
                    event.clientX /
                    window.innerWidth
                ) * 2 - 1;


            mouse.y =
                -(
                    event.clientY /
                    window.innerHeight
                ) * 2 + 1;


            raycaster.setFromCamera(
                mouse,
                camera
            );


            /*
            Heart area detection

            Points do not always raycast reliably
            with tiny particle size, so use a
            distance-based center detection.
            */

            const distance =
                Math.sqrt(
                    mouse.x * mouse.x +
                    mouse.y * mouse.y
                );


            if (
                distance < 0.45
            ) {

                createExplosion();


                /*
                Heart punch animation
                */

                gsap.fromTo(
                    heartGroup.scale,

                    {
                        x: 1,
                        y: 1,
                        z: 1
                    },

                    {
                        x: 1.35,
                        y: 1.35,
                        z: 1.35,

                        duration: 0.18,

                        ease: "power3.out",

                        yoyo: true,

                        repeat: 1
                    }
                );


                /*
                Camera shake
                */

                gsap.to(
                    camera.position,
                    {
                        x:
                            camera.position.x +
                            (Math.random() - 0.5) *
                            0.3,

                        y:
                            camera.position.y +
                            (Math.random() - 0.5) *
                            0.3,

                        duration: 0.08,

                        yoyo: true,

                        repeat: 3,

                        ease: "power2.inOut"
                    }
                );
            }
        }
    );


    /*
    ============================================================
        MOUSE PARALLAX
    ============================================================
    */

    let mouseX = 0;

    let mouseY = 0;


    window.addEventListener(
        "pointermove",
        (event) => {

            mouseX =
                (
                    event.clientX /
                    window.innerWidth
                ) * 2 - 1;


            mouseY =
                (
                    event.clientY /
                    window.innerHeight
                ) * 2 - 1;
        }
    );


    /*
    ============================================================
        ANIMATION
    ============================================================
    */

    const clock =
        new THREE.Clock();


    function animate() {

        requestAnimationFrame(
            animate
        );


        const elapsed =
            clock.getElapsedTime();


        /*
        Galaxy rotation
        */

        galaxyGroup.rotation.y =
            elapsed * 0.025;


        galaxyGroup.rotation.x =
            Math.sin(elapsed * 0.08) *
            0.08;


        /*
        Star rotation
        */

        stars.rotation.y =
            elapsed * 0.008;


        stars.rotation.x =
            elapsed * 0.003;


        /*
        Heart rotation
        */

        heartGroup.rotation.y +=
            0.002;


        heartGroup.rotation.x =
            Math.sin(
                elapsed * 0.7
            ) * 0.08;


        /*
        Heart breathing
        */

        const pulse =
            1 +
            Math.sin(
                elapsed * 2.5
            ) * 0.035;


        heartGroup.scale.set(
            pulse,
            pulse,
            pulse
        );


        /*
        Rings
        */

        ring1.rotation.z +=
            0.003;

        ring2.rotation.z -=
            0.002;

        ring3.rotation.z +=
            0.0015;


        /*
        Mouse parallax
        */

        heartGroup.position.x +=
            (
                mouseX * 0.35 -
                heartGroup.position.x
            ) * 0.02;


        heartGroup.position.y +=
            (
                -mouseY * 0.25 -
                heartGroup.position.y
            ) * 0.02;


        /*
        Explosion movement
        */

        if (
            explosionParticles
        ) {

            const positions =
                explosionParticles
                    .geometry
                    .attributes
                    .position
                    .array;


            const velocities =
                explosionParticles
                    .userData
                    .velocities;


            for (
                let i = 0;
                i < positions.length;
                i += 3
            ) {

                positions[i] +=
                    velocities[i];

                positions[i + 1] +=
                    velocities[i + 1];

                positions[i + 2] +=
                    velocities[i + 2];


                velocities[i] *= 0.985;

                velocities[i + 1] *= 0.985;

                velocities[i + 2] *= 0.985;
            }


            explosionParticles
                .geometry
                .attributes
                .position
                .needsUpdate = true;
        }


        /*
        Controls
        */

        controls.update();


        /*
        Render
        */

        renderer.render(
            scene,
            camera
        );
    }


    animate();


    /*
    ============================================================
        RESPONSIVE
    ============================================================
    */

    window.addEventListener(
        "resize",
        () => {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );


            renderer.setPixelRatio(
                Math.min(
                    window.devicePixelRatio,
                    2
                )
            );
        }
    );

</script>

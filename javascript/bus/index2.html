<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Heart Galaxy & Memories</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #010008;
            font-family: 'Pyidaungsu', 'Myanmar Text', Inter, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #app {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .noise {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.035;
            z-index: 10;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
        }
    </style>
</head>

<body>

<div id="app"></div>
<div class="noise"></div>

<!-- THREE IMPORT MAP -->
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

const { gsap } = await import("https://cdn.jsdelivr.net/npm/gsap@3.13.0/+esm");

/* =========================================================
   SCENE & CAMERA
========================================================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010008);
scene.fog = new THREE.FogExp2(0x04000e, 0.015);

const camera = new THREE.PerspectiveCamera(
    50,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);
camera.position.set(0, 1.5, 16);

/* =========================================================
   RENDERER
========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.getElementById("app").appendChild(renderer.domElement);

/* =========================================================
   BLOOM PASS (စာလုံးများ ရှင်းရှင်းလင်းလင်း မြင်ရအောင် အလင်းလျှော့ထားပါသည်)
========================================================= */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.95,  // Bloom Strength လျှော့ချထားခြင်း
    0.6,
    0.2
);
composer.addPass(bloomPass);

/* =========================================================
   ORBIT CONTROLS
========================================================= */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enablePan = false;
controls.minDistance = 6;
controls.maxDistance = 25;
controls.target.set(0, 0, 0);

/* =========================================================
   LIGHTS
========================================================= */
const pinkLight = new THREE.PointLight(0xff2d95, 45, 20);
pinkLight.position.set(0, 1, 4);
scene.add(pinkLight);

const blueLight = new THREE.PointLight(0x4070ff, 40, 25);
blueLight.position.set(-6, 3, 3);
scene.add(blueLight);

const purpleLight = new THREE.PointLight(0x9a40ff, 35, 25);
purpleLight.position.set(6, -3, -2);
scene.add(purpleLight);

/* =========================================================
   GALAXY (MILKY WAY PARTICLES)
========================================================= */
const galaxy = new THREE.Group();
scene.add(galaxy);

const galaxyCount = 13000;
const galaxyPositions = new Float32Array(galaxyCount * 3);
const galaxyColors = new Float32Array(galaxyCount * 3);

const pinkCol = new THREE.Color(0xff459c);
const purpleCol = new THREE.Color(0x9d54ff);
const blueCol = new THREE.Color(0x458eff);
const whiteCol = new THREE.Color(0xffffff);

for (let i = 0; i < galaxyCount; i++) {
    const i3 = i * 3;
    const radius = Math.pow(Math.random(), 0.6) * 16;
    const arms = 5;
    const branch = ((i % arms) / arms) * Math.PI * 2;
    const spin = radius * 0.65;
    const angle = branch + spin;
    const spread = Math.pow(Math.random(), 3) * 1.5;

    galaxyPositions[i3] = Math.cos(angle) * radius + (Math.random() - 0.5) * spread;
    galaxyPositions[i3 + 1] = (Math.random() - 0.5) * spread * 0.6;
    galaxyPositions[i3 + 2] = Math.sin(angle) * radius + (Math.random() - 0.5) * spread;

    const rnd = Math.random();
    let col = rnd < 0.35 ? pinkCol : rnd < 0.6 ? purpleCol : rnd < 0.85 ? blueCol : whiteCol;

    galaxyColors[i3] = col.r;
    galaxyColors[i3 + 1] = col.g;
    galaxyColors[i3 + 2] = col.b;
}

const galaxyGeometry = new THREE.BufferGeometry();
galaxyGeometry.setAttribute("position", new THREE.BufferAttribute(galaxyPositions, 3));
galaxyGeometry.setAttribute("color", new THREE.BufferAttribute(galaxyColors, 3));

const galaxyMaterial = new THREE.PointsMaterial({
    size: 0.035,
    transparent: true,
    opacity: 0.85,
    vertexColors: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
});

const galaxyParticles = new THREE.Points(galaxyGeometry, galaxyMaterial);
galaxy.add(galaxyParticles);

/* =========================================================
   REFINED 3D HEART (အသဲပုံစံကို လှပကြည်လင်အောင် ပြင်ဆင်ထားသည်)
========================================================= */
function createSleekHeartShape() {
    const shape = new THREE.Shape();
    // အချိုးအစား ပြေပြစ်သော Smooth Heart Curve
    shape.moveTo(0, 1.2);
    shape.bezierCurveTo(0, 2.3, -2.4, 2.7, -2.4, 1.1);
    shape.bezierCurveTo(-2.4, -0.4, -1.2, -1.6, 0, -2.7);
    shape.bezierCurveTo(1.2, -1.6, 2.4, -0.4, 2.4, 1.1);
    shape.bezierCurveTo(2.4, 2.7, 0, 2.3, 0, 1.2);
    return shape;
}

const heartShape = createSleekHeartShape();
const heartGeometry = new THREE.ExtrudeGeometry(heartShape, {
    depth: 0.55,           // အထူကို လျှော့ချပြီး ကျော့ရှင်းစေသည်
    bevelEnabled: true,
    bevelSegments: 12,
    steps: 2,
    bevelSize: 0.28,
    bevelThickness: 0.28,
    curveSegments: 48
});
heartGeometry.center();

// Crystal Glass Texture
const glassMaterial = new THREE.MeshPhysicalMaterial({
    color: 0xff3b98,
    metalness: 0.1,
    roughness: 0.12,
    transmission: 0.88,
    thickness: 1.1,
    ior: 1.48,
    transparent: true,
    opacity: 0.85,
    clearcoat: 1.0,
    clearcoatRoughness: 0.08,
    emissive: 0x3d001e,     // အလင်းစူးမထွက်စေရန် နူးညံ့သောအလင်းသုံးထားသည်
    emissiveIntensity: 0.4
});

const glassHeart = new THREE.Mesh(heartGeometry, glassMaterial);
glassHeart.scale.set(0.85, 0.85, 0.85);
scene.add(glassHeart);

// Heart Core Particles
const heartParticleCount = 3000;
const heartPPos = new Float32Array(heartParticleCount * 3);
const heartPCol = new Float32Array(heartParticleCount * 3);

for (let i = 0; i < heartParticleCount; i++) {
    const i3 = i * 3;
    const t = Math.random() * Math.PI * 2;
    const scale = Math.sqrt(Math.random());

    let x = 16 * Math.pow(Math.sin(t), 3);
    let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    x *= scale * 0.15;
    y *= scale * 0.15;
    const z = (Math.random() - 0.5) * scale * 0.7;

    heartPPos[i3] = x;
    heartPPos[i3 + 1] = y;
    heartPPos[i3 + 2] = z;

    const r = Math.random();
    const c = r < 0.5 ? new THREE.Color(0xff68b8) : new THREE.Color(0xffffff);
    heartPCol[i3] = c.r;
    heartPCol[i3 + 1] = c.g;
    heartPCol[i3 + 2] = c.b;
}

const heartPGeom = new THREE.BufferGeometry();
heartPGeom.setAttribute("position", new THREE.BufferAttribute(heartPPos, 3));
heartPGeom.setAttribute("color", new THREE.BufferAttribute(heartPCol, 3));

const heartParticles = new THREE.Points(heartPGeom, new THREE.PointsMaterial({
    size: 0.04,
    transparent: true,
    opacity: 0.85,
    vertexColors: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
}));
scene.add(heartParticles);

/* =========================================================
   ORBIT RINGS
========================================================= */
const rings = new THREE.Group();
scene.add(rings);

function createRing(radius, color, opacity, rotX, rotZ) {
    const geom = new THREE.TorusGeometry(radius, 0.015, 16, 200);
    const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity, blending: THREE.AdditiveBlending });
    const mesh = new THREE.Mesh(geom, mat);
    mesh.rotation.x = rotX;
    mesh.rotation.z = rotZ;
    return mesh;
}
rings.add(
    createRing(4.2, 0xff3b9e, 0.5, Math.PI / 2, 0),
    createRing(5.2, 0x526cff, 0.4, Math.PI / 2.6, 0.4),
    createRing(6.2, 0xb84cff, 0.3, Math.PI / 1.7, -0.4)
);

/* =========================================================
   TEXT + EXAMPLE PHOTO CARDS (စာသား + နမူနာပုံ ကတ်ပြားများ)
========================================================= */

// Canvas ပေါ်တွင် အလှဆင် နမူနာပုံ ရေးဆွဲပေးသော Function
function drawExamplePhoto(ctx, x, y, w, h, photoIndex) {
    ctx.save();
    // ဓာတ်ပုံဘောင် (Rounded Rect Clip)
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 14);
    ctx.clip();

    // ကောင်းကင် နောက်ခံ Gradient
    const skyGrad = ctx.createLinearGradient(x, y, x, y + h);
    if (photoIndex === 0) {
        skyGrad.addColorStop(0, "#2c0b38");
        skyGrad.addColorStop(1, "#f7418f");
    } else if (photoIndex === 1) {
        skyGrad.addColorStop(0, "#081b3a");
        skyGrad.addColorStop(1, "#5378ff");
    } else if (photoIndex === 2) {
        skyGrad.addColorStop(0, "#22083b");
        skyGrad.addColorStop(1, "#9e38ff");
    } else {
        skyGrad.addColorStop(0, "#2f0525");
        skyGrad.addColorStop(1, "#ff6b8b");
    }
    ctx.fillStyle = skyGrad;
    ctx.fillRect(x, y, w, h);

    // လမင်း (Moon)
    ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
    ctx.beginPath();
    ctx.arc(x + w * 0.72, y + h * 0.35, 30, 0, Math.PI * 2);
    ctx.fill();

    // ကြယ်ကလေးများ (Stars)
    ctx.fillStyle = "#ffffff";
    for (let s = 0; s < 25; s++) {
        const sx = x + (Math.sin(s * 78) * 0.5 + 0.5) * w;
        const sy = y + (Math.cos(s * 43) * 0.5 + 0.5) * (h * 0.6);
        ctx.fillRect(sx, sy, 2.5, 2.5);
    }

    // တောင်တန်း Silhouette
    ctx.fillStyle = "rgba(10, 3, 20, 0.85)";
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    ctx.lineTo(x, y + h * 0.7);
    ctx.quadraticCurveTo(x + w * 0.35, y + h * 0.55, x + w * 0.65, y + h * 0.75);
    ctx.lineTo(x + w, y + h * 0.62);
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
    ctx.fill();

    // စုံတွဲ / အသဲ Silhouette ပုံလေး
    ctx.font = "42px serif";
    ctx.textAlign = "center";
    ctx.fillText("👩‍❤️‍👨", x + w * 0.48, y + h * 0.84);

    ctx.restore();

    // ဓာတ်ပုံဘောင် အဖြူရောင် လိုင်း
    ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 14);
    ctx.stroke();
}

// စာသားနှင့် ပုံပါဝင်သော Card Sprite ဖန်တီးခြင်း
function createCardSprite(cardData, index) {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = 512;
    canvas.height = 620;

    // Card Glass Background
    ctx.beginPath();
    ctx.roundRect(16, 16, 480, 588, 24);
    ctx.fillStyle = "rgba(18, 8, 30, 0.82)";
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(255, 90, 180, 0.65)";
    ctx.stroke();

    // ခေါင်းစဉ် စာသား (Text)
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "bold 34px 'Pyidaungsu', 'Myanmar Text', Inter, sans-serif";
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "rgba(255, 50, 150, 0.8)";
    ctx.shadowBlur = 12;
    ctx.fillText(cardData.text, canvas.width / 2, 75);

    // Shadow ပိတ်၍ ပုံဆွဲခြင်း
    ctx.shadowBlur = 0;

    // စာသားအောက်က Example Photo ဆွဲပေးခြင်း
    drawExamplePhoto(ctx, 40, 130, 432, 440, index);

    const texture = new THREE.CanvasTexture(canvas);
    texture.needsUpdate = true;

    const material = new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        depthWrite: false
    });

    const sprite = new THREE.Sprite(material);
    sprite.scale.set(3.4, 4.1, 1); // သင့်တင့်သော Card အချိုးအစား
    return sprite;
}

// ၄ ဘက် ၄ တန် ညီညာစွာ ခွာထားသော စာသားများနှင့် ပုံများ
const cardsConfig = [
    { text: "အရမ်းချစ်တယ် ❤️", angle: 0, radius: 7.8, y: 0.9 },
    { text: "You are my galaxy ✨", angle: Math.PI * 0.5, radius: 8.2, y: -0.9 },
    { text: "Forever 💕 ချစ်မယ်", angle: Math.PI, radius: 7.8, y: 1.1 },
    { text: "My universe starts with you အာဘွား", angle: Math.PI * 1.5, radius: 8.2, y: -1.1 }
];

const cardSprites = [];

cardsConfig.forEach((cfg, index) => {
    const sprite = createCardSprite(cfg, index);
    sprite.position.x = Math.cos(cfg.angle) * cfg.radius;
    sprite.position.z = Math.sin(cfg.angle) * cfg.radius;
    sprite.position.y = cfg.y;

    sprite.userData = {
        baseY: cfg.y,
        speed: 1.2 + Math.random() * 0.4,
        offset: index * 1.5
    };

    // Galaxy Group ထဲ ထည့်ထားသဖြင့် Galaxy နှင့်အတူ လိုက်လည်မည်ဖြစ်သည်
    galaxy.add(sprite);
    cardSprites.push(sprite);
});

/* =========================================================
   EXPLOSION INTERACTION (အသဲကို နှိပ်လျှင် ပေါက်ကွဲသည့် Animation)
========================================================= */
let explosion = null;

function createExplosion() {
    if (explosion) scene.remove(explosion);

    const count = 4000;
    const positions = new Float32Array(count * 3);
    const velocities = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);

    for (let i = 0; i < count; i++) {
        const i3 = i * 3;
        const dir = new THREE.Vector3(
            Math.random() - 0.5,
            Math.random() - 0.5,
            Math.random() - 0.5
        ).normalize();
        const r = Math.random() * 0.5;

        positions[i3] = dir.x * r;
        positions[i3 + 1] = dir.y * r;
        positions[i3 + 2] = dir.z * r;

        const speed = 0.04 + Math.random() * 0.16;
        velocities[i3] = dir.x * speed;
        velocities[i3 + 1] = dir.y * speed;
        velocities[i3 + 2] = dir.z * speed;

        const col = new THREE.Color(Math.random() < 0.5 ? 0xff3b9d : 0x7b5cff);
        colors[i3] = col.r;
        colors[i3 + 1] = col.g;
        colors[i3 + 2] = col.b;
    }

    const geom = new THREE.BufferGeometry();
    geom.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geom.setAttribute("color", new THREE.BufferAttribute(colors, 3));

    const mat = new THREE.PointsMaterial({
        size: 0.05,
        transparent: true,
        opacity: 1,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });

    explosion = new THREE.Points(geom, mat);
    explosion.userData.velocities = velocities;
    scene.add(explosion);

    // Punch Animations
    gsap.fromTo(camera.position, { z: camera.position.z }, {
        z: camera.position.z - 1.2,
        duration: 0.12,
        yoyo: true,
        repeat: 1,
        ease: "power2.out"
    });

    gsap.fromTo(glassHeart.scale, { x: 0.85, y: 0.85, z: 0.85 }, {
        x: 1.12, y: 1.12, z: 1.12,
        duration: 0.18,
        yoyo: true,
        repeat: 1,
        ease: "power2.out"
    });

    gsap.to(mat, {
        opacity: 0,
        duration: 2.2,
        ease: "power2.out",
        onComplete() {
            if (explosion) {
                scene.remove(explosion);
                explosion.geometry.dispose();
                explosion.material.dispose();
                explosion = null;
            }
        }
    });
}

// Click on Heart
renderer.domElement.addEventListener("pointerup", (event) => {
    const x = event.clientX / window.innerWidth;
    const y = event.clientY / window.innerHeight;
    if (Math.abs(x - 0.5) < 0.22 && Math.abs(y - 0.5) < 0.3) {
        createExplosion();
    }
});

/* =========================================================
   ANIMATION LOOP
========================================================= */
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const time = clock.getElapsedTime();

    // Galaxy လှည့်ပတ်ခြင်း (စာသားနှင့် ဓာတ်ပုံ ကတ်ပြားများပါ အတူတူ လည်ပတ်နေမည်)
    galaxy.rotation.y = time * 0.02;
    galaxy.rotation.x = Math.sin(time * 0.08) * 0.04;

    // Card များကို ငြင်သာစွာ လွင့်မျောစေခြင်း
    cardSprites.forEach((sprite) => {
        sprite.position.y = sprite.userData.baseY + Math.sin(time * sprite.userData.speed + sprite.userData.offset) * 0.15;
    });

    // Glass Heart Animation
    glassHeart.rotation.y += 0.003;
    glassHeart.rotation.x = Math.sin(time * 0.6) * 0.05;
    glassHeart.position.y = Math.sin(time * 1.3) * 0.06;

    // Heart Particles
    heartParticles.rotation.y = time * 0.07;
    heartParticles.position.y = Math.sin(time * 1.3) * 0.06;

    // Orbit Rings
    rings.children[0].rotation.z += 0.002;
    rings.children[1].rotation.z -= 0.0015;
    rings.children[2].rotation.z += 0.001;

    // Explosion Update
    if (explosion) {
        const pos = explosion.geometry.attributes.position.array;
        const vel = explosion.userData.velocities;
        for (let i = 0; i < pos.length; i += 3) {
            pos[i] += vel[i];
            pos[i + 1] += vel[i + 1];
            pos[i + 2] += vel[i + 2];
            vel[i] *= 0.985;
            vel[i + 1] *= 0.985;
            vel[i + 2] *= 0.985;
        }
        explosion.geometry.attributes.position.needsUpdate = true;
    }

    controls.update();
    composer.render();
}

animate();

/* =========================================================
   RESIZE
========================================================= */
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    composer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>

<!DOCTYPE html>
<html>

<head>
    <style>
        .container {
            display: flex;
            /* flex-direction: row; */
            /* flex-direction: column; */
            /* flex-direction: row-reverse; */
            /* flex-direction: column-reverse; */
            flex-wrap: nowrap;
            /* flex-wrap: wrap; */
            /* flex-wrap: wrap-reverse; */
            background-color: DodgerBlue;
        }

        .container div {
            background-color: #f1f1f1;
            margin: 10px;
            padding: 20px;
            font-size: 24px;
        }
    </style>
</head>

<body>

    <h1>Create a Flex Container</h1>

    <div class="container">
        <div><h2>&#128511;</h2></div>
        <div><h2>&#128509;</h2></div>
        <div>Item 3</div>
        <div>Item 4</div>
        <div>Item 5</div>
    </div>

    <p>Flexbox must have a parent element with the display property set to flex or inline-flex.</p>
    <p>Direct child elements of the flex container automatically becomes flex items.</p>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Basics</title>

    <style>

        h1 {
            color: blue;
            font-size: 40px;
        }

        p {
            color: gray;
            font-size: 18px;
        }

        .box {
            background-color: lightblue;
            padding: 20px;
        }

        #special {
            color: red;
        }

    </style>
</head>

<body>

    <h1>Hello CSS</h1>

    <p>This is paragraph.</p>

    <div class="box">
        This is a box.
    </div>

    <p id="special">
        Special paragraph
    </p>

</body>
</html>

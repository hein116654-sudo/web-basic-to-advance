<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Operators</title>
</head>
<body>
    <h1>JavaScript Operators Demo</h1>
    <p>Open the browser console (F12 or Right Click -> Inspect -> Console) to see the output.</p>

    <script>
        console.log("\n===== Chapter (3) - Operators =====");

        let num1 = 10;
        let num2 = 3;

        // Arithmetic operations
        console.log("Addition:", num1 + num2);
        console.log("Modulus:", num1 % num2);

        // Comparison operations
        console.log("Is 10 strictly equal to '10' (===):", 10 === 10);
        console.log("Is 10 greater than 5 (>):", 10 > 5);

        // Logical operations
        let hasTicket = true;  //1
        let isVip = false;    //0
        console.log("Is access granted (AND &&):", hasTicket && isVip);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Data Types</h2>
    
    <script>
        let myName = 'Hein';   //string
        let myAge = 21;        //int
        let isProgrammer  = true; //boolean
        let futureGoal;          //undefined
        let emptyWallet = null    //


        console.log("Name: ", myName);
        console.log("Age: ", myAge);

        console.log(`My name is ${myName}. I am ${myAge} years old.`);

        //type of => data type check
        console.log("Name data type: ", typeof myName);
        console.log("Age data type: ", typeof myAge);
        console.log("Programmer data type: ", typeof isProgrammer);
        console.log("future data type: ", typeof futureGoal);
        console.log("empty data type: ", typeof emptyWallet);


    </script>

</body>
</html>
